spring.application.name=backend
spring.profiles.default=dev

server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.public-url=${APP_PUBLIC_URL:http://localhost:5173}
app.api.public-response-limit=${PUBLIC_API_RESPONSE_LIMIT:200}
app.api.private-response-limit=${PRIVATE_API_RESPONSE_LIMIT:200}
app.api.admin-response-limit=${ADMIN_API_RESPONSE_LIMIT:500}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}
app.security.hsts.enabled=${SECURITY_HSTS_ENABLED:false}
app.security.hsts.max-age-seconds=${SECURITY_HSTS_MAX_AGE_SECONDS:31536000}
app.security.hsts.include-subdomains=${SECURITY_HSTS_INCLUDE_SUBDOMAINS:true}
app.security.hsts.preload=${SECURITY_HSTS_PRELOAD:false}
app.security.require-database-ssl=${REQUIRE_DATABASE_SSL:false}
app.security.turnstile.enabled=${TURNSTILE_ENABLED:false}
app.security.turnstile.secret=${TURNSTILE_SECRET:}
app.security.turnstile.siteverify-url=${TURNSTILE_SITEVERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
app.security.turnstile.allowed-hostnames=${TURNSTILE_ALLOWED_HOSTNAMES:}
app.maintenance.api-key=${MAINTENANCE_API_KEY:}
app.bootstrap.admin.email=${ADMIN_EMAIL}
app.bootstrap.admin.password=${ADMIN_PASSWORD}
app.auth.rate-limit-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:12}
app.auth.password-reset-token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:30}
app.booking.rate-limit-per-minute=${BOOKING_RATE_LIMIT_PER_MINUTE:6}
app.review.rate-limit-per-minute=${REVIEW_RATE_LIMIT_PER_MINUTE:6}
app.client-content.submit.rate-limit-per-minute=${CLIENT_CONTENT_SUBMIT_RATE_LIMIT_PER_MINUTE:10}
app.media.storage-provider=${MEDIA_STORAGE_PROVIDER:local}
app.media.local-directory=${MEDIA_LOCAL_DIRECTORY:uploads}
app.media.private-local-directory=${MEDIA_PRIVATE_LOCAL_DIRECTORY:}
app.media.r2.endpoint=${R2_ENDPOINT:}
app.media.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.media.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.media.r2.public-bucket=${R2_PUBLIC_BUCKET:}
app.media.r2.private-bucket=${R2_PRIVATE_BUCKET:}
app.media.r2.region=${R2_REGION:auto}
app.media.upload.rate-limit-per-minute=${MEDIA_UPLOAD_RATE_LIMIT_PER_MINUTE:30}
app.media.client-content.max-pending-uploads-per-user=${CLIENT_CONTENT_MAX_PENDING_UPLOADS_PER_USER:12}
app.media.client-content.max-pending-upload-bytes-per-user=${CLIENT_CONTENT_MAX_PENDING_UPLOAD_BYTES_PER_USER:314572800}
app.media.client-content.private-upload-retention-hours=${CLIENT_CONTENT_PRIVATE_UPLOAD_RETENTION_HOURS:24}
app.media.client-content.cleanup-cron=${CLIENT_CONTENT_PRIVATE_UPLOAD_CLEANUP_CRON:0 30 3 * * *}
app.booking.email.enabled=${BOOKING_EMAIL_ENABLED:false}
app.booking.email.smtp-host=${BOOKING_EMAIL_SMTP_HOST:}
app.booking.email.smtp-port=${BOOKING_EMAIL_SMTP_PORT:25}
app.booking.email.smtp-ssl=${BOOKING_EMAIL_SMTP_SSL:false}
app.booking.email.smtp-starttls=${BOOKING_EMAIL_SMTP_STARTTLS:false}
app.booking.email.username=${BOOKING_EMAIL_USERNAME:}
app.booking.email.password=${BOOKING_EMAIL_PASSWORD:}
app.booking.email.from=${BOOKING_EMAIL_FROM:no-reply@saltosnaspalhacadas.pt}
app.booking.reminder.days-before=${BOOKING_REMINDER_DAYS_BEFORE:5}
app.booking.reminder.cron=${BOOKING_REMINDER_CRON:0 0 9 * * *}
app.booking.reminder.zone=${BOOKING_REMINDER_ZONE:Europe/Lisbon}
app.support.ai.enabled=${SUPPORT_AI_ENABLED:false}
app.support.ai.api-key=${OPENAI_API_KEY:}
app.support.ai.endpoint=${OPENAI_API_ENDPOINT:https://api.openai.com/v1/responses}
app.support.ai.model=${OPENAI_MODEL:gpt-5.6-luna}
app.support.ai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:320}
app.support.chat.rate-limit-per-minute=${SUPPORT_CHAT_RATE_LIMIT_PER_MINUTE:20}
spring.servlet.multipart.max-file-size=${MEDIA_MAX_FILE_SIZE:30MB}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST_SIZE:31MB}
