services:
  postgres:
    image: postgres:17
    container_name: saltos-nas-palhacadas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: saltos_nas_palhacadas
      POSTGRES_USER: saltos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saltos_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
