services:
  - type: web
    name: saltos-nas-palhacadas-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    disk:
      name: saltos-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: PUBLIC_API_RESPONSE_LIMIT
        value: "200"
      - key: PRIVATE_API_RESPONSE_LIMIT
        value: "200"
      - key: ADMIN_API_RESPONSE_LIMIT
        value: "500"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_HOURS
        value: "8"
      - key: SECURITY_HSTS_ENABLED
        value: "true"
      - key: SECURITY_HSTS_MAX_AGE_SECONDS
        value: "31536000"
      - key: SECURITY_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SECURITY_HSTS_PRELOAD
        value: "false"
      - key: REQUIRE_DATABASE_SSL
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: BOOKING_RATE_LIMIT_PER_MINUTE
        value: "6"
      - key: REVIEW_RATE_LIMIT_PER_MINUTE
        value: "6"
      - key: CLIENT_CONTENT_SUBMIT_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MEDIA_LOCAL_DIRECTORY
        value: /var/data/uploads
      - key: MEDIA_PRIVATE_LOCAL_DIRECTORY
        value: /var/data/uploads-private
      - key: MEDIA_UPLOAD_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: CLIENT_CONTENT_MAX_PENDING_UPLOADS_PER_USER
        value: "12"
      - key: CLIENT_CONTENT_MAX_PENDING_UPLOAD_BYTES_PER_USER
        value: "314572800"
      - key: CLIENT_CONTENT_PRIVATE_UPLOAD_RETENTION_HOURS
        value: "24"
      - key: CLIENT_CONTENT_PRIVATE_UPLOAD_CLEANUP_CRON
        value: "0 30 3 * * *"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BOOKING_EMAIL_ENABLED
        value: "false"
      - key: BOOKING_EMAIL_SMTP_HOST
        sync: false
      - key: BOOKING_EMAIL_SMTP_PORT
        value: "587"
      - key: BOOKING_EMAIL_SMTP_SSL
        value: "false"
      - key: BOOKING_EMAIL_SMTP_STARTTLS
        value: "true"
      - key: BOOKING_EMAIL_USERNAME
        sync: false
      - key: BOOKING_EMAIL_PASSWORD
        sync: false
      - key: BOOKING_EMAIL_FROM
        sync: false
      - key: SUPPORT_AI_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_ENDPOINT
        value: https://api.openai.com/v1/responses
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "320"
      - key: SUPPORT_CHAT_RATE_LIMIT_PER_MINUTE
        value: "20"
