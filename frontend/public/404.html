<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | Saltos nas Palhaçadas</title>
    <style>
      :root { color: #252421; background: #faf9f6; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-width: 320px; margin: 0; }
      main { width: min(720px, calc(100% - 40px)); margin: 0 auto; padding: 96px 0; }
      img { width: 52px; height: 52px; }
      p { color: #716f6a; line-height: 1.65; }
      h1 { margin: 22px 0 14px; font: 600 56px/1 Georgia, "Times New Roman", serif; letter-spacing: 0; }
      a { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #252421; padding: 12px 16px; color: #252421; text-decoration: none; }
      a:hover { background: #252421; color: white; }
      a svg { width: 17px; height: 17px; transition: transform 160ms ease; }
      a:hover svg { transform: translateX(-2px); }
      @media (max-width: 620px) { main { padding: 64px 0; } h1 { font-size: 40px; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Página não encontrada</h1>
      <p>Este endereço não existe ou já não está disponível.</p>
      <a href="/">
        <svg aria-hidden="true" fill="none" focusable="false" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M19 12H5" />
          <path d="m11 6-6 6 6 6" />
        </svg>
        Voltar ao site
      </a>
    </main>
  </body>
</html>
